[package]
name = "rsterm"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = "0.25.2"
accesskit_winit = "0.34.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.5"
libc = "0.2.191"
pollster = "1.0.3"
unicode-width = "0.2.3"
vte = "0.15.0"
wgpu = "30.0.2"
winit = "0.30.13"

[profile.release]
lto = "fat"
codegen-units = 1
